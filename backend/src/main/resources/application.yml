spring:
  application:
    name: promou-backend
  datasource:
    # Local: DB_URL o los valores por defecto. Render: DB_HOST, DB_PORT y DB_NAME (render.yaml).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:promou}}
    username: ${DB_USER:promou}
    password: ${DB_PASSWORD:promou}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo gestiona Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  # SMTP opcional (desarrollo o servidor propio). En Render gratis los puertos SMTP están bloqueados: usar BREVO_API_KEY.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

promou:
  admin:
    correo: ${ADMIN_CORREO:admin@plataforma.com}
    contrasena: ${ADMIN_CONTRASENA:}                    # obligatoria para sembrar el administrador
    nombre: Administrador
  notificaciones:
    # El correo del remitente debe estar verificado en Brevo (Senders & IP > Senders).
    remitente: ${CORREO_REMITENTE:PromoU <no-reply@promou.app>}
    brevo-api-key: ${BREVO_API_KEY:}                     # sin clave, los enlaces quedan en el log
  front:
    url: ${FRONT_URL:http://localhost:8443}             # base de los enlaces de confirmación y restablecimiento
    version-terminos: "2026-11"
  seguridad:
    dominios-institucionales: >
      udea.edu.co,unal.edu.co,eafit.edu.co,upb.edu.co,udem.edu.co,itm.edu.co,
      colmayor.edu.co,ces.edu.co,javeriana.edu.co,uniandes.edu.co
    inactividad-sesion: 30m
    max-intentos-fallidos: 5
    ventana-intentos: 15m
    duracion-bloqueo: 15m
    vigencia-credencial: 365d
    vigencia-enlace-confirmacion: 24h
    vigencia-enlace-restablecimiento: 1h
    cookie-segura: ${COOKIE_SEGURA:true}                # false solo en desarrollo local por http
    peticiones-auth-por-minuto-ip: 30
    correos-por-ventana: 3
    ventana-correos: 15m
