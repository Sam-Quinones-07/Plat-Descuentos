name: promou

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: promou
      POSTGRES_USER: promou
      POSTGRES_PASSWORD: promou
    volumes:
      - promou-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promou -d promou"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev            # administrador de prueba (admin@plataforma.com / Descuentos@04)
      DB_URL: jdbc:postgresql://db:5432/promou
      DB_USER: promou
      DB_PASSWORD: promou
      FRONT_URL: http://localhost:8443         # enlaces de los correos (sin BREVO_API_KEY quedan en el log)
    ports:
      - "8080:8080"                           # opcional: para probar la API directamente

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8443:80"

volumes:
  promou-data:
